name: Build & Test

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Test, build & pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Pack zip
        run: npm run pack

      - name: Upload dist (unpacked)
        uses: actions/upload-artifact@v4
        with:
          name: dev-quick-assistant-dist
          path: dist/

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: dev-quick-assistant-zip
          path: release/*.zip

  release:
    name: Attach zip to GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci && npm test && npm run build && npm run pack

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
